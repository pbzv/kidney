<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="main.css">
        <title>رفيق الكلى</title>
    </head>
    <body>
        <header>
            <input type="checkbox" id="menu-toggle" hidden>
            <label for="menu-toggle" class="menu-icon">
                <svg viewBox="0 0 640 640">
                    <path d="M96 160C96 142.3 110.3 128 128 128L512 128C529.7 128 544 142.3 544 160C544 177.7 529.7 192 512 192L128 192C110.3 192 96 177.7 96 160zM96 320C96 302.3 110.3 288 128 288L512 288C529.7 288 544 302.3 544 320C544 337.7 529.7 352 512 352L128 352C110.3 352 96 337.7 96 320zM544 480C544 497.7 529.7 512 512 512L128 512C110.3 512 96 497.7 96 480C96 462.3 110.3 448 128 448L512 448C529.7 448 544 462.3 544 480z"/>
                </svg>
            </label>
        
            <nav class="nav-menu">
                <button id="logout">تسجيل الخروج</button>
            </nav>
        </header>
        <div id="Head">
            <h1 class="main-header">رَفِيقُ الكِلَى</h1> 
            <h1 class="main-header-caption">مَرحَباً, {{user}}</h1>
        </div>
        <main class="cards">
            <div class="liquid-row">
                <div class="card" id="liquid">
                    <h1 class="title">شُرْبِ السَّوَائلِ اليَوْم</h1>
                    <div class="info">
                        <div class="drink_percentage">
                            <span></span>
                            <div class="percentage"></div>
                        </div>
                        <button id="drink_btn">200mL+</button>
                    </div>
                </div>
            </div>
        
            <div class="card" id="appointment">
                <h1 class="title">الجَلْسَةُ القَادِمَةُ</h1>
                <div class="info">
                    <h2 class="time-left">{{appointment}}</h2>
                    <p class="date">{{date}}</p>
                </div>
            </div>
        
            <div class="card" id="prescription">
                <h1 class="title">الوصفة الطبية</h1>
                <div class="info">
                    <p class="medicine">{{medicine}}</p>
                    <p class="dosage">{{dosage}}</p>
                </div>
            </div>
        
            <div class="card" id="notes">
                <h1 class="title">ملاحظات الطبيب</h1>
                <div class="info">
                    <p class="diagnosis">
                        {{notes}}
                    </p>
                </div>
            </div>
        
            <div class="card" id="alerts">
                <h1 class="title">التذكير بشرب السوائل</h1>
                <div class="info">
                    <p class="alert">لتفعيل التذكير بشرب السوائل انقر الزر </p>
                
                    <article class="reminder-settings">
                        <section class="wakeup-time">
                            <label for="wakeup">وقت الاستيقاظ</label>
                            <input type="time" id="wakeuptime" name="wakeup" required>
                        </section>
                    
                        <section class="bedtime">
                            <label for="bedtime">وقت النوم</label>
                            <input type="time" id="bedtime" name="bedtime" required>
                        </section>
                    
                        <div class="buttons">
                            <button class="reject-btn"><span>إلغاء</span></button>
                            <button class="submit-btn"><span>تفعيل التذكير</span></button>
                        </div>
                    </article>
                
                    <label class="switch">
                        <input id="toggle" type="checkbox">
                        <span class="slider"></span>
                    </label>
                
                    <p id="error_msg"></p>
                </div>
            </div>
        </main>
        <script src="main.js"></script>
    </body>
</html>
