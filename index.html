<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Modern Emerald app</title>
        <style>
            
        </style>
    </head>
    <body>
        <header>
            <h1 class="header">مشروع الكلى</h1>
        </header>
        <main>
            <div id="Head">
                <h1 class="main-header">رفيق الكلى</h1> 
                <h1 class="main-header-caption">معاً ضد المستحيل</h1>
            </div>

            <article id="appointment">
                <h1 class="main-header">جلسات الغسيل</h1>
                <hr>
                <table>
                    <thead>
                        <tr>
                            <th>الاسم</th>
                            <th>العمر</th>
                            <th>الموعد</th>
                            <th>الحالة</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <td>أحمد علي</td>
                            <td>45</td>
                            <td>10:00 صباحاً</td>
                            <td class="ok">مستقر</td>
                        </tr>

                        <tr>
                            <td>سارة محمد</td>
                            <td>32</td>
                            <td>11:30 صباحاً</td>
                            <td class="warn">مراقبة</td>
                        </tr>

                        <tr>
                            <td>خالد يوسف</td>
                            <td>58</td>
                            <td>01:00 ظهراً</td>
                            <td class="danger">حرجة</td>
                        </tr>
                    </tbody>
                </table>
            </article>

            <article id="prescription">
                <h1 class="main-header">وصفات طبية</h1>
                <hr>
                
            </article>
        </main>
    </body>
</html>
