<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>Login</title>
</head>
<body>
    <main>
        <img src="/icons/logo.png" alt="logo" class="logo">
        <div class="id_input">
            <input type="text" id="email_input" placeholder="الرقم المدني">
            <label for="id">البريد الإلكتروني</label>
        </div>
        <button type="button" class="gradient-button">تسجيل الدخول</button>
        <p id="error_msg"></p>
    </main>

    <script>
        const LoginInput = document.getElementById('email_input');
        const SubmitBtn = document.querySelector('.gradient-button');
        const ErrorMsg = document.getElementById('error_msg');

        document.addEventListener('click', e => {
            if(ErrorMsg.textContent && !document.getElementsByTagName('main')[0].contains(e.target)){
                ErrorMsg.textContent = '';
            }
        });

        SubmitBtn.addEventListener('click', () => {
            try{
                if(!LoginInput.value){
                    throw new Error("الرجاء إدخال البريد الإلكتروني");
                    return;
                }
                else{
                    window.location.href = "main.html";
                }
            }
            catch(err){
                ErrorMsg.textContent = err.message;
            }
        });
    </script>
</body>
</html>
